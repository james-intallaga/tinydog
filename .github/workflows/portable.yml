name: Portable CPU

on:
  push:
    paths:
      - ".github/workflows/portable.yml"
      - "pyproject.toml"
      - "configs/**"
      - "src/**"
      - "tests/**"
      - "interface/**"
      - "tinydog.sh"
      - "tinydog.cmd"
      - "tinydog.ps1"
  pull_request:
    paths:
      - ".github/workflows/portable.yml"
      - "pyproject.toml"
      - "configs/**"
      - "src/**"
      - "tests/**"
      - "interface/**"
      - "tinydog.sh"
      - "tinydog.cmd"
      - "tinydog.ps1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portable-cpu-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable-cpu:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"

    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      TINYDOG_BACKEND: torch
      TINYDOG_MODEL_SIZE: 20m

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install base project and test tools
        run: python -m pip install -e ".[dev]"

      - name: Install the PyTorch CPU engine
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.4,<3"

      - name: Verify portable training and inference
        run: >-
          python -m pytest -q
          tests/test_apprenticeship.py
          tests/test_scratch_tokenizer.py
          tests/test_portable.py
          tests/test_model_sizes.py
          tests/test_bootstrap.py
          tests/test_personal_training.py
          tests/test_personal_foundation.py
          tests/test_portable_bundle.py
          tests/test_torch_hybrid.py
          tests/test_torch_foundation_train.py
          tests/test_torch_personal.py
          tests/test_portable_serve.py

  portable-screen:
    name: Local screen / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    defaults:
      run:
        working-directory: interface

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.13"
          cache: npm
          cache-dependency-path: interface/package-lock.json

      - name: Verify Windows launcher propagates failures
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmd /c "..\tinydog.cmd definitely-not-a-command"
          $launcherCode = $LASTEXITCODE
          if ($launcherCode -eq 0) {
            throw "tinydog.cmd hid a launcher failure"
          }
          exit 0

      - name: Install the local screen
        run: npm ci --no-audit --no-fund

      - name: Verify the local screen
        run: npm test

      - name: Check types
        run: npx tsc --noEmit

      - name: Check style
        run: npm run lint

      - name: Build the production screen
        run: npm run build
